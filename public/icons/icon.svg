<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#16345f"/>
      <stop offset="100%" stop-color="#050b19"/>
    </radialGradient>
    <linearGradient id="flake" gradientUnits="userSpaceOnUse" x1="-150" y1="-150" x2="150" y2="150">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256)" stroke="url(#flake)" stroke-width="16" stroke-linecap="round" fill="none">
    <g id="arm">
      <line x1="0" y1="0" x2="0" y2="-150"/>
      <polyline points="-36,-96 0,-62 36,-96"/>
      <polyline points="-26,-132 0,-108 26,-132"/>
    </g>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
